<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城治学生会物资管理系统 - 数据大屏</title>
    <script>
        // 设备检测：手机访问自动跳转到手机端
        (function() {
            var ua = navigator.userAgent.toLowerCase();
            var isMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile/i.test(ua)
                || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
                || window.innerWidth < 768;
            if (isMobile) {
                window.location.href = '/m/login';
            }
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0c1445 0%, #1a237e 50%, #0d47a1 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-bottom: 2px solid rgba(100,181,246,0.3);
            position: relative;
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #64b5f6, #4fc3f7, #81d4fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
        }
        .header .time { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #90caf9; }
        .header .back { position: absolute; left: 30px; top: 50%; transform: translateY(-50%); }
        .header .back a { color: #90caf9; text-decoration: none; font-size: 14px; }
        .container { padding: 20px; max-width: 1600px; margin: 0 auto; }
        .row { display: grid; gap: 20px; margin-bottom: 20px; }
        .row-4 { grid-template-columns: repeat(4, 1fr); }
        .row-3 { grid-template-columns: repeat(3, 1fr); }
        .row-2 { grid-template-columns: repeat(2, 1fr); }
        .card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(100,181,246,0.2);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .card:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(100,181,246,0.5);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .card-title {
            font-size: 15px;
            color: #90caf9;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(180deg, #64b5f6, #1e88e5);
            border-radius: 2px;
        }
        .stat-number {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #4fc3f7, #29b6f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }
        .stat-label { font-size: 13px; color: #90caf9; margin-top: 4px; }
        .stat-sub { font-size: 12px; color: #78909c; margin-top: 8px; }
        .chart-container { position: relative; height: 260px; }
        .chart-container-sm { position: relative; height: 220px; }
        .location-list { margin-top: 10px; }
        .location-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 13px;
        }
        .location-item .name { color: #bbdefb; }
        .location-item .count { color: #4fc3f7; font-weight: 600; }
        @media (max-width: 1200px) {
            .row-4 { grid-template-columns: repeat(2, 1fr); }
            .row-3 { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            body { padding-bottom: 20px; }
            .header { padding: 15px 12px; }
            .header h1 { font-size: 16px; letter-spacing: 1px; }
            .header .time { position: static; transform: none; margin-top: 8px; font-size: 11px; text-align: center; }
            .header .back { position: static; transform: none; margin-bottom: 8px; text-align: center; }
            .header .back a { font-size: 12px; }
            .container { padding: 12px; }
            .row { gap: 12px; margin-bottom: 12px; }
            .row-4, .row-2 { grid-template-columns: 1fr; }
            .card { padding: 15px; }
            .card-title { font-size: 13px; margin-bottom: 8px; }
            .stat-number { font-size: 32px; }
            .stat-label { font-size: 12px; }
            .stat-sub { font-size: 11px; margin-top: 6px; }
            .chart-container { height: 220px; }
            .chart-container-sm { height: 180px; }
            .location-list { margin-top: 10px; }
            .location-item { padding: 8px 0; font-size: 12px; }
        }
        @media (max-width: 480px) {
            .header h1 { font-size: 14px; }
            .stat-number { font-size: 28px; }
            .chart-container { height: 200px; }
            .chart-container-sm { height: 160px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="back"><a href="/">← 返回管理后台</a></div>
        <h1>📊 城治学生会物资管理数据可视化大屏</h1>
        <div class="time" id="currentTime"></div>
    </div>

    <div class="container">
        <!-- 核心指标 -->
        <div class="row row-4">
            <div class="card" onclick="window.location.href='/?page=materials'">
                <div class="card-title">物资种类</div>
                <div class="stat-number" id="materialCount">0</div>
                <div class="stat-label">种物资</div>
            </div>
            <div class="card" onclick="window.location.href='/?page=materials'">
                <div class="card-title">库存总量</div>
                <div class="stat-number" id="totalStock">0</div>
                <div class="stat-label">件/个</div>
                <div class="stat-sub">可领取 <span id="availableStock">0</span> · 已借出 <span id="borrowedStock">0</span></div>
            </div>
            <div class="card" onclick="window.location.href='/?page=records'">
                <div class="card-title">累计领取</div>
                <div class="stat-number" id="borrowTotal">0</div>
                <div class="stat-label">件/次</div>
                <div class="stat-sub">共 <span id="borrowCount">0</span> 次领取记录</div>
            </div>
            <div class="card" onclick="window.location.href='/?page=records'">
                <div class="card-title">累计归还</div>
                <div class="stat-number" id="returnTotal">0</div>
                <div class="stat-label">件/次</div>
                <div class="stat-sub">共 <span id="returnCount">0</span> 次归还记录</div>
            </div>
        </div>

        <!-- 图表行1 -->
        <div class="row row-2">
            <div class="card" onclick="window.location.href='/?page=records'">
                <div class="card-title">近7天领取趋势</div>
                <div class="chart-container"><canvas id="trendChart"></canvas></div>
            </div>
            <div class="card" onclick="window.location.href='/?page=materials'">
                <div class="card-title">库存状态分布</div>
                <div class="chart-container"><canvas id="stockChart"></canvas></div>
            </div>
        </div>

        <!-- 图表行2 -->
        <div class="row row-2">
            <div class="card" onclick="window.location.href='/?page=materials'">
                <div class="card-title">存放位置分布</div>
                <div class="chart-container-sm"><canvas id="locationChart"></canvas></div>
                <div class="location-list" id="locationList"></div>
            </div>
            <div class="card" onclick="window.location.href='/?page=records'">
                <div class="card-title">领取 vs 归还 对比</div>
                <div class="chart-container"><canvas id="compareChart"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';

        // 时间
        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString('zh-CN');
        }
        updateTime();
        setInterval(updateTime, 1000);

        let trendChart, stockChart, locationChart, compareChart;

        function loadStats() {
            fetch('/api/stats/overview', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(res => {
                if (res.status === 401) { window.location.href = '/login'; return; }
                return res.json();
            })
            .then(data => {
                if (!data) return;
                // 核心指标
                document.getElementById('materialCount').textContent = data.material_count;
                document.getElementById('totalStock').textContent = data.total_stock;
                document.getElementById('availableStock').textContent = data.available_stock;
                document.getElementById('borrowedStock').textContent = data.borrowed_stock;
                document.getElementById('borrowTotal').textContent = data.borrow_total;
                document.getElementById('borrowCount').textContent = data.borrow_count;
                document.getElementById('returnTotal').textContent = data.return_total;
                document.getElementById('returnCount').textContent = data.return_count;

                // 趋势图
                const trendCtx = document.getElementById('trendChart').getContext('2d');
                if (trendChart) trendChart.destroy();
                trendChart = new Chart(trendCtx, {
                    type: 'line',
                    data: {
                        labels: data.borrow_trend.map(t => t.date),
                        datasets: [{
                            label: '领取数量',
                            data: data.borrow_trend.map(t => t.count),
                            borderColor: '#4fc3f7',
                            backgroundColor: 'rgba(79,195,247,0.15)',
                            fill: true,
                            tension: 0.4,
                            pointBackgroundColor: '#4fc3f7',
                            pointRadius: 4
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#90caf9' } } },
                        scales: {
                            x: { ticks: { color: '#78909c' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                            y: { ticks: { color: '#78909c' }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true }
                        }
                    }
                });

                // 库存状态饼图
                const stockCtx = document.getElementById('stockChart').getContext('2d');
                if (stockChart) stockChart.destroy();
                stockChart = new Chart(stockCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['库存充足(>5)', '库存偏低(1-5)', '库存为零'],
                        datasets: [{
                            data: [data.stock_status.ok, data.stock_status.low, data.stock_status.out],
                            backgroundColor: ['#66bb6a', '#ffa726', '#ef5350'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { position: 'right', labels: { color: '#90caf9', padding: 12 } } }
                    }
                });

                // 存放位置环形图
                const locCtx = document.getElementById('locationChart').getContext('2d');
                if (locationChart) locationChart.destroy();
                const locColors = ['#4fc3f7','#81c784','#ffb74d','#f06292','#ba68c8','#4dd0e1','#fff176','#a1887f'];
                locationChart = new Chart(locCtx, {
                    type: 'doughnut',
                    data: {
                        labels: data.location_dist.map(l => l.loc),
                        datasets: [{
                            data: data.location_dist.map(l => l.cnt),
                            backgroundColor: locColors,
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: false } }
                    }
                });

                // 位置列表
                document.getElementById('locationList').innerHTML = data.location_dist.map((l,i) =>
                    `<div class="location-item"><span class="name">${l.loc}</span><span class="count">${l.cnt} 种</span></div>`
                ).join('');

                // 领取vs归还对比
                const cmpCtx = document.getElementById('compareChart').getContext('2d');
                if (compareChart) compareChart.destroy();
                compareChart = new Chart(cmpCtx, {
                    type: 'bar',
                    data: {
                        labels: ['累计数量', '记录次数'],
                        datasets: [
                            { label: '领取', data: [data.borrow_total, data.borrow_count], backgroundColor: 'rgba(79,195,247,0.7)', borderRadius: 6 },
                            { label: '归还', data: [data.return_total, data.return_count], backgroundColor: 'rgba(129,199,132,0.7)', borderRadius: 6 }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#90caf9' } } },
                        scales: {
                            x: { ticks: { color: '#78909c' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                            y: { ticks: { color: '#78909c' }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true }
                        }
                    }
                });
            })
            .catch(err => console.error('加载统计失败:', err));
        }

        loadStats();
        setInterval(loadStats, 30000); // 每30秒自动刷新
    </script>
</body>
</html>
