<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城治学生会综合管理系统 - 数据大屏</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", -apple-system, sans-serif;
            background: #0a1128;
            background-image: 
                radial-gradient(ellipse at top, rgba(30,60,140,0.4) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(20,80,120,0.3) 0%, transparent 50%);
            min-height: 100vh;
            color: #e3f2fd;
            overflow-x: hidden;
        }
        /* 顶部标题栏 */
        .header {
            position: relative;
            text-align: center;
            padding: 18px 20px 15px;
            background: linear-gradient(180deg, rgba(15,30,70,0.9) 0%, transparent 100%);
            border-bottom: 1px solid rgba(100,181,246,0.2);
        }
        .header::before, .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 30%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #4fc3f7, transparent);
        }
        .header::before { left: 10%; }
        .header::after { right: 10%; }
        .header h1 {
            font-size: 30px;
            background: linear-gradient(90deg, #4fc3f7, #81d4fa, #4fc3f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 6px;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(79,195,247,0.5);
        }
        .header .subtitle { font-size: 13px; color: #78909c; margin-top: 5px; letter-spacing: 2px; }
        .header .time { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #90caf9; }
        .header .back { position: absolute; left: 30px; top: 50%; transform: translateY(-50%); }
        .header .back a { color: #90caf9; text-decoration: none; font-size: 14px; padding: 6px 14px; border: 1px solid rgba(100,181,246,0.3); border-radius: 4px; }
        .header .back a:hover { background: rgba(100,181,246,0.1); }

        /* 主容器 */
        .container { padding: 18px; max-width: 1800px; margin: 0 auto; }
        .row { display: grid; gap: 16px; margin-bottom: 16px; }
        .row-6 { grid-template-columns: repeat(6, 1fr); }
        .row-4 { grid-template-columns: repeat(4, 1fr); }
        .row-3 { grid-template-columns: repeat(3, 1fr); }
        .row-2 { grid-template-columns: repeat(2, 1fr); }

        /* 统计卡片 */
        .stat-card {
            background: linear-gradient(135deg, rgba(20,40,90,0.6) 0%, rgba(15,30,70,0.4) 100%);
            border: 1px solid rgba(100,181,246,0.25);
            border-radius: 8px;
            padding: 18px 15px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        .stat-card:hover {
            border-color: rgba(79,195,247,0.6);
            box-shadow: 0 4px 20px rgba(79,195,247,0.2);
            transform: translateY(-2px);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 3px; height: 100%;
            background: linear-gradient(180deg, #4fc3f7, #1976d2);
        }
        .stat-card .icon {
            position: absolute;
            right: 12px; top: 15px;
            font-size: 32px;
            opacity: 0.3;
        }
        .stat-number {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #4fc3f7, #81d4fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }
        .stat-label { font-size: 13px; color: #90caf9; margin-top: 6px; }
        .stat-trend { font-size: 11px; color: #66bb6a; margin-top: 4px; }

        /* 图表卡片 */
        .chart-card {
            background: linear-gradient(135deg, rgba(20,40,90,0.5) 0%, rgba(15,30,70,0.3) 100%);
            border: 1px solid rgba(100,181,246,0.2);
            border-radius: 8px;
            padding: 18px;
            position: relative;
        }
        .chart-card .title {
            font-size: 15px;
            color: #90caf9;
            margin-bottom: 15px;
            padding-left: 12px;
            border-left: 3px solid #4fc3f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chart-card .title .badge {
            font-size: 11px;
            background: rgba(79,195,247,0.15);
            color: #4fc3f7;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .chart-container { position: relative; height: 280px; }
        .chart-container-sm { position: relative; height: 240px; }

        /* 列表卡片 */
        .list-card {
            background: linear-gradient(135deg, rgba(20,40,90,0.5) 0%, rgba(15,30,70,0.3) 100%);
            border: 1px solid rgba(100,181,246,0.2);
            border-radius: 8px;
            padding: 18px;
        }
        .list-card .title {
            font-size: 15px;
            color: #90caf9;
            margin-bottom: 15px;
            padding-left: 12px;
            border-left: 3px solid #4fc3f7;
        }
        .rank-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .rank-item:last-child { border-bottom: none; }
        .rank-num {
            width: 24px; height: 24px;
            border-radius: 50%;
            background: rgba(100,181,246,0.2);
            color: #90caf9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .rank-item:nth-child(1) .rank-num { background: linear-gradient(135deg, #ffd54f, #ff8f00); color: #fff; }
        .rank-item:nth-child(2) .rank-num { background: linear-gradient(135deg, #b0bec5, #78909c); color: #fff; }
        .rank-item:nth-child(3) .rank-num { background: linear-gradient(135deg, #ffab91, #d84315); color: #fff; }
        .rank-name { flex: 1; font-size: 13px; color: #bbdefb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rank-value { font-size: 14px; color: #4fc3f7; font-weight: 600; }

        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10,17,40,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(79,195,247,0.2);
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { margin-top: 15px; color: #90caf9; font-size: 14px; }

        /* 响应式 */
        @media (max-width: 1400px) {
            .row-6 { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 1024px) {
            .row-4 { grid-template-columns: repeat(2, 1fr); }
            .row-3 { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .header h1 { font-size: 18px; letter-spacing: 2px; }
            .header .time, .header .back { position: static; transform: none; margin: 5px 0; }
            .container { padding: 12px; }
            .row { gap: 10px; margin-bottom: 10px; }
            .row-6, .row-4, .row-3, .row-2 { grid-template-columns: repeat(2, 1fr); }
            .stat-number { font-size: 24px; }
            .stat-label { font-size: 12px; }
            .chart-container { height: 200px; }
            .chart-container-sm { height: 180px; }
            .stat-card { padding: 12px 10px; }
            .stat-card .icon { font-size: 24px; }
            .chart-card, .list-card { padding: 12px; }
            .chart-card .title, .list-card .title { font-size: 13px; margin-bottom: 10px; }
        }
        @media (max-width: 480px) {
            .row-6, .row-4, .row-3, .row-2 { grid-template-columns: 1fr; }
            .header h1 { font-size: 16px; letter-spacing: 1px; }
            .stat-number { font-size: 28px; }
        }
    </style>
</head>
<body>
    <!-- 加载动画 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">数据加载中...</div>
    </div>

    <!-- 顶部标题 -->
    <div class="header">
        <div class="back"><a href="javascript:goBack()">← 返回系统</a></div>
        <h1>城治学生会综合管理系统</h1>
        <div class="subtitle">DATA VISUALIZATION DASHBOARD</div>
        <div class="time" id="currentTime"></div>
    </div>

    <div class="container">
        <!-- 核心指标 -->
        <div class="row row-6">
            <div class="stat-card">
                <div class="icon">📦</div>
                <div class="stat-number" id="materialCount">0</div>
                <div class="stat-label">物资种类</div>
            </div>
            <div class="stat-card">
                <div class="icon">📊</div>
                <div class="stat-number" id="totalStock">0</div>
                <div class="stat-label">库存总量</div>
            </div>
            <div class="stat-card">
                <div class="icon">✅</div>
                <div class="stat-number" id="availableStock">0</div>
                <div class="stat-label">可领取</div>
            </div>
            <div class="stat-card">
                <div class="icon">🔄</div>
                <div class="stat-number" id="borrowedStock">0</div>
                <div class="stat-label">已借出</div>
            </div>
            <div class="stat-card">
                <div class="icon">👥</div>
                <div class="stat-number" id="userTotal">0</div>
                <div class="stat-label">用户总数</div>
            </div>
            <div class="stat-card">
                <div class="icon">📅</div>
                <div class="stat-number" id="activityTotal">0</div>
                <div class="stat-label">活动总数</div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="row row-2">
            <div class="chart-card">
                <div class="title">📈 近7天领取趋势 <span class="badge">实时</span></div>
                <div class="chart-container"><canvas id="trendChart"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="title">🥧 库存状态分布</div>
                <div class="chart-container"><canvas id="stockChart"></canvas></div>
            </div>
        </div>

        <div class="row row-3">
            <div class="chart-card">
                <div class="title">📍 存放位置库存TOP5</div>
                <div class="chart-container-sm"><canvas id="locationChart"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="title">🏆 物资领取排行TOP5</div>
                <div class="list-card" style="background:none;border:none;padding:0;">
                    <div id="borrowRankList"></div>
                </div>
            </div>
            <div class="chart-card">
                <div class="title">👤 部门人员分布</div>
                <div class="chart-container-sm"><canvas id="deptChart"></canvas></div>
            </div>
        </div>

        <div class="row row-2">
            <div class="chart-card">
                <div class="title">📋 最近领用记录</div>
                <div id="recentRecords" style="max-height:280px;overflow-y:auto;"></div>
            </div>
            <div class="chart-card">
                <div class="title">⚠️ 库存预警</div>
                <div id="warningList" style="max-height:280px;overflow-y:auto;"></div>
            </div>
        </div>
    </div>

    <script>
        // 获取token（同时支持普通用户和管理员）
        let token = localStorage.getItem('token') || localStorage.getItem('admin_token');
        if (!token) {
            window.location.href = '/m/login';
        }

        // 设备判断
        var ua = navigator.userAgent.toLowerCase();
        var isMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile/i.test(ua)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
            || window.innerWidth < 768;

        function goBack() {
            if (isMobile) {
                window.location.href = '/m/admin';
            } else {
                window.location.href = '/';
            }
        }

        // 更新时间
        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString('zh-CN');
        }
        updateTime();
        setInterval(updateTime, 1000);

        let trendChart, stockChart, locationChart, deptChart;
        let loadRetryCount = 0;
        const MAX_RETRY = 3;

        // 带重试的fetch
        function fetchWithRetry(url, options, retry = 0) {
            return fetch(url, options)
                .then(res => {
                    if (res.status === 401) {
                        window.location.href = '/m/login';
                        return null;
                    }
                    return res.json();
                })
                .catch(err => {
                    if (retry < MAX_RETRY) {
                        console.log('加载失败，第' + (retry+1) + '次重试...');
                        return new Promise(resolve => setTimeout(() => {
                            fetchWithRetry(url, options, retry + 1).then(resolve);
                        }, 1000));
                    }
                    console.error('加载失败，已重试' + MAX_RETRY + '次', err);
                    return null;
                });
        }

        // 加载统计数据
        function loadStats() {
            fetchWithRetry('/api/stats/overview', {
                headers: { 'Authorization': 'Bearer ' + token }
            }).then(data => {
                if (!data) {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    return;
                }
                // 核心指标
                document.getElementById('materialCount').textContent = data.material_count || 0;
                document.getElementById('totalStock').textContent = data.total_stock || 0;
                document.getElementById('availableStock').textContent = data.available_stock || 0;
                document.getElementById('borrowedStock').textContent = data.borrowed_stock || 0;

                // 趋势图
                const trendCtx = document.getElementById('trendChart').getContext('2d');
                if (trendChart) trendChart.destroy();
                trendChart = new Chart(trendCtx, {
                    type: 'line',
                    data: {
                        labels: (data.borrow_trend || []).map(t => t.date),
                        datasets: [{
                            label: '领取数量',
                            data: (data.borrow_trend || []).map(t => t.count),
                            borderColor: '#4fc3f7',
                            backgroundColor: 'rgba(79,195,247,0.15)',
                            fill: true,
                            tension: 0.4,
                            pointBackgroundColor: '#4fc3f7',
                            pointRadius: 5,
                            pointHoverRadius: 7,
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#90caf9' } } },
                        scales: {
                            x: { ticks: { color: '#78909c' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                            y: { ticks: { color: '#78909c' }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true }
                        }
                    }
                });

                // 库存状态饼图
                const stockCtx = document.getElementById('stockChart').getContext('2d');
                if (stockChart) stockChart.destroy();
                stockChart = new Chart(stockCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['可领取', '已借出', '库存为零'],
                        datasets: [{
                            data: [data.available_stock || 0, data.borrowed_stock || 0, data.out_of_stock || 0],
                            backgroundColor: ['#66bb6a', '#ffa726', '#ef5350'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'right', labels: { color: '#90caf9', padding: 15 } }
                        }
                    }
                });

                // 位置库存柱状图
                const locationCtx = document.getElementById('locationChart').getContext('2d');
                if (locationChart) locationChart.destroy();
                const locData = (data.location_stats || []).slice(0, 5);
                locationChart = new Chart(locationCtx, {
                    type: 'bar',
                    data: {
                        labels: locData.map(l => l.location),
                        datasets: [{
                            label: '库存数量',
                            data: locData.map(l => l.stock),
                            backgroundColor: 'rgba(79,195,247,0.6)',
                            borderColor: '#4fc3f7',
                            borderWidth: 1,
                            borderRadius: 4
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        indexAxis: 'y',
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { ticks: { color: '#78909c' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                            y: { ticks: { color: '#90caf9' }, grid: { display: false } }
                        }
                    }
                });

                loadRetryCount = 0;
                document.getElementById('loadingOverlay').style.display = 'none';
            });
        }

        // 加载用户统计
        function loadUserStats() {
            fetchWithRetry('/api/users', {
                headers: { 'Authorization': 'Bearer ' + token }
            }).then(users => {
                if (!users) return;
                document.getElementById('userTotal').textContent = users.length;
                const depts = {};
                users.forEach(u => {
                    const d = u.department || '未分配';
                    depts[d] = (depts[d] || 0) + 1;
                });
                const deptCtx = document.getElementById('deptChart').getContext('2d');
                if (deptChart) deptChart.destroy();
                deptChart = new Chart(deptCtx, {
                    type: 'polarArea',
                    data: {
                        labels: Object.keys(depts),
                        datasets: [{
                            data: Object.values(depts),
                            backgroundColor: [
                                'rgba(79,195,247,0.6)',
                                'rgba(102,187,106,0.6)',
                                'rgba(255,167,38,0.6)',
                                'rgba(239,83,80,0.6)',
                                'rgba(171,71,188,0.6)',
                                'rgba(38,166,154,0.6)'
                            ],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { position: 'right', labels: { color: '#90caf9', font: { size: 11 } } } }
                    }
                });
            });
        }

        // 加载活动统计
        function loadActivityStats() {
            fetchWithRetry('/api/activities', {
                headers: { 'Authorization': 'Bearer ' + token }
            }).then(activities => {
                if (!activities) return;
                document.getElementById('activityTotal').textContent = activities.length;
            });
        }

        // 加载物资领取排行
        function loadBorrowRank() {
            fetchWithRetry('/api/materials', {
                headers: { 'Authorization': 'Bearer ' + token }
            }).then(materials => {
                if (!materials) return;
                const sorted = materials.sort((a, b) => (b.borrow_count || 0) - (a.borrow_count || 0)).slice(0, 5);
                const html = sorted.map((m, i) => `
                    <div class="rank-item">
                        <div class="rank-num">${i+1}</div>
                        <div class="rank-name">${m.name}</div>
                        <div class="rank-value">${m.borrow_count || 0}次</div>
                    </div>
                `).join('');
                document.getElementById('borrowRankList').innerHTML = html || '<div style="text-align:center;color:#78909c;padding:20px;">暂无数据</div>';
            });
        }

        // 加载最近领用记录
        function loadRecentRecords() {
            fetchWithRetry('/api/transactions?limit=8', {
                headers: { 'Authorization': 'Bearer ' + token }
            }).then(records => {
                if (!records) return;
                const html = records.map(r => `
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
                        <div>
                            <div style="font-size:13px;color:#bbdefb;">${r.material_name}</div>
                            <div style="font-size:11px;color:#78909c;margin-top:2px;">${r.user_name || '未知'} · ${r.type === 'borrow' ? '领取' : '归还'}</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:13px;color:${r.type === 'borrow' ? '#ffa726' : '#66bb6a'};font-weight:600;">${r.type === 'borrow' ? '领取' : '归还'} ${r.quantity}</div>
                            <div style="font-size:11px;color:#78909c;margin-top:2px;">${(r.created_at || '').slice(0, 16)}</div>
                        </div>
                    </div>
                `).join('');
                document.getElementById('recentRecords').innerHTML = html || '<div style="text-align:center;color:#78909c;padding:20px;">暂无记录</div>';
            }).catch(() => {
                // 如果API不存在，用备用方式
                fetchWithRetry('/api/my-transactions', {
                    headers: { 'Authorization': 'Bearer ' + token }
                }).then(records => {
                    if (!records) return;
                    const html = records.slice(0, 8).map(r => `
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
                            <div>
                                <div style="font-size:13px;color:#bbdefb;">${r.material_name || '物资'}</div>
                                <div style="font-size:11px;color:#78909c;margin-top:2px;">${r.type === 'borrow' ? '领取' : '归还'}</div>
                            </div>
                            <div style="text-align:right;">
                                <div style="font-size:13px;color:${r.type === 'borrow' ? '#ffa726' : '#66bb6a'};font-weight:600;">${r.type === 'borrow' ? '领取' : '归还'} ${r.quantity || 1}</div>
                                <div style="font-size:11px;color:#78909c;margin-top:2px;">${(r.created_at || '').slice(0, 16)}</div>
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('recentRecords').innerHTML = html || '<div style="text-align:center;color:#78909c;padding:20px;">暂无记录</div>';
                });
            });
        }

        // 加载库存预警
        function loadWarningList() {
            fetchWithRetry('/api/materials', {
                headers: { 'Authorization': 'Bearer ' + token }
            }).then(materials => {
                if (!materials) return;
                const warnings = materials.filter(m => (m.available_stock || 0) <= 5).slice(0, 8);
                const html = warnings.map(m => `
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
                        <div style="font-size:13px;color:#bbdefb;">${m.name}</div>
                        <div style="font-size:13px;color:${m.available_stock === 0 ? '#ef5350' : '#ffa726'};font-weight:600;">
                            ${m.available_stock === 0 ? '库存为零' : '仅剩' + m.available_stock}
                        </div>
                    </div>
                `).join('');
                document.getElementById('warningList').innerHTML = html || '<div style="text-align:center;color:#66bb6a;padding:20px;">✅ 所有物资库存充足</div>';
            });
        }

        // 初始化加载
        function initDashboard() {
            loadStats();
            loadUserStats();
            loadActivityStats();
            loadBorrowRank();
            loadRecentRecords();
            loadWarningList();
        }

        // 等待Chart.js加载完成后初始化
        if (typeof Chart !== 'undefined') {
            initDashboard();
        } else {
            let chartWaitCount = 0;
            const chartWaitInterval = setInterval(() => {
                chartWaitCount++;
                if (typeof Chart !== 'undefined') {
                    clearInterval(chartWaitInterval);
                    initDashboard();
                } else if (chartWaitCount > 20) {
                    clearInterval(chartWaitInterval);
                    document.getElementById('loadingOverlay').style.display = 'none';
                    alert('图表库加载失败，请刷新页面重试');
                }
            }, 200);
        }

        // 每30秒自动刷新
        setInterval(() => {
            loadStats();
            loadBorrowRank();
            loadRecentRecords();
            loadWarningList();
        }, 30000);
    </script>
</body>
</html>
