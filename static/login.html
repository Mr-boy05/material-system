<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城治学生会物资管理系统 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 360px;
        }
        .login-box h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .login-box .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-login:active { transform: translateY(0); }
        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        .success-msg {
            color: #2e7d32;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        .tip {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            font-size: 12px;
        }
        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
        }
        .links a:hover { text-decoration: underline; }

        /* 修改密码弹窗 */
        .modal-mask {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: white;
            border-radius: 14px;
            padding: 28px;
            width: 380px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h3 {
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
            text-align: center;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-cancel {
            flex: 1;
            padding: 12px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #666;
        }
        .btn-submit {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div style="text-align:center;margin-bottom:20px;">
            <img src="/static/college_logo_color.png" alt="重庆超大城市数字化治理学院" style="max-width:100%;height:auto;max-height:50px;object-fit:contain;margin-bottom:12px;">
            <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
                <img src="/static/logo.png" alt="系统logo" style="height:28px;object-fit:contain;border-radius:6px;">
                <span style="font-size:16px;font-weight:700;color:#1a1a2e;letter-spacing:1px;">城治学生会综合管理系统</span>
            </div>
        </div>
        <h1 style="font-size:16px;margin-bottom:6px;color:#666;font-weight:500;">管理后台登录</h1>
        <div class="form-group">
            <label>账号</label>
            <input type="text" id="username" placeholder="请输入账号">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:12px;font-size:13px;color:#666;">
            <input type="checkbox" id="autoLogin" style="width:16px;height:16px;cursor:pointer;">
            <label for="autoLogin" style="cursor:pointer;margin:0;">自动登录（7天内免输入）</label>
        </div>
        <button class="btn-login" onclick="doLogin()">登 录</button>
        <div class="error-msg" id="errorMsg"></div>
        <div class="links">
            <a href="javascript:void(0)" onclick="openChangePwd()">🔑 修改密码</a>
            <a href="javascript:void(0)" onclick="openForgotPwd()">❓ 忘记密码</a>
            <a href="/m/login">📱 手机端 →</a>
        </div>
        <div class="tip">默认管理员：admin / admin123</div>
    </div>

    <!-- 修改密码弹窗 -->
    <div class="modal-mask" id="pwdModal">
        <div class="modal">
            <h3>🔑 修改密码</h3>
            <div class="form-group">
                <label>账号</label>
                <input type="text" id="pwdUsername" placeholder="请输入账号">
            </div>
            <div class="form-group">
                <label>原密码</label>
                <input type="password" id="pwdOld" placeholder="请输入原密码">
            </div>
            <div class="form-group">
                <label>新密码（至少4位）</label>
                <input type="password" id="pwdNew" placeholder="请输入新密码">
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" id="pwdConfirm" placeholder="请再次输入新密码">
            </div>
            <div class="error-msg" id="pwdError" style="display:none;margin-top:0;"></div>
            <div class="success-msg" id="pwdSuccess" style="display:none;margin-top:0;"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeChangePwd()">取消</button>
                <button class="btn-submit" onclick="submitChangePwd()">确认修改</button>
            </div>
        </div>
    </div>

    <!-- 忘记密码弹窗 -->
    <div class="modal-mask" id="forgotModal">
        <div class="modal">
            <h3>❓ 忘记密码</h3>
            <p style="color:#999;font-size:13px;margin-bottom:16px;">通过绑定的邮箱接收验证码重置密码</p>
            <div class="form-group">
                <label>绑定邮箱</label>
                <input type="email" id="forgotEmail" placeholder="请输入绑定的邮箱">
            </div>
            <div class="form-group">
                <label>验证码</label>
                <div style="display:flex;gap:8px;">
                    <input type="text" id="forgotCode" placeholder="请输入6位验证码" style="flex:1;">
                    <button id="sendCodeBtn" onclick="sendResetCode()" style="padding:0 16px;background:#667eea;color:white;border:none;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap;">发送验证码</button>
                </div>
            </div>
            <div class="form-group">
                <label>新密码（至少4位）</label>
                <input type="password" id="forgotNewPwd" placeholder="请输入新密码">
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" id="forgotConfirmPwd" placeholder="请再次输入新密码">
            </div>
            <div class="error-msg" id="forgotError" style="display:none;margin-top:0;"></div>
            <div class="success-msg" id="forgotSuccess" style="display:none;margin-top:0;"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeForgotPwd()">取消</button>
                <button class="btn-submit" onclick="submitResetPwd()">重置密码</button>
            </div>
        </div>
    </div>

    <script>
        function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            if (!username || !password) {
                errorMsg.textContent = '请输入账号和密码';
                errorMsg.style.display = 'block';
                return;
            }

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json().then(data => ({ ok: res.ok, data })))
            .then(({ ok, data }) => {
                if (ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data));
                    // 自动登录：保存凭据（处理中文用户名）
                    if (document.getElementById('autoLogin').checked) {
                        const cred = btoa(encodeURIComponent(username) + ':' + encodeURIComponent(password));
                        localStorage.setItem('auto_login_cred', cred);
                    } else {
                        localStorage.removeItem('auto_login_cred');
                    }
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = data.detail || '登录失败';
                    errorMsg.style.display = 'block';
                }
            })
            .catch(err => {
                errorMsg.textContent = '网络错误，请重试';
                errorMsg.style.display = 'block';
            });
        }

        // 页面加载时检查自动登录
        (function() {
            // 如果已经登录，直接跳转
            if (localStorage.getItem('token')) {
                window.location.href = '/';
                return;
            }
            // 检查是否有保存的自动登录凭据
            const cred = localStorage.getItem('auto_login_cred');
            const justLoggedOut = localStorage.getItem('just_logged_out') === '1';
            if (cred) {
                try {
                    const raw = atob(cred);
                    const sep = raw.indexOf(':');
                    const u = decodeURIComponent(raw.substring(0, sep));
                    const p = decodeURIComponent(raw.substring(sep + 1));
                    document.getElementById('username').value = u;
                    document.getElementById('password').value = p;
                    document.getElementById('autoLogin').checked = true;
                    // 刚退出登录时不自动登录，只填充，方便切换账号
                    if (!justLoggedOut) {
                        setTimeout(doLogin, 100);
                    } else {
                        localStorage.removeItem('just_logged_out');
                    }
                } catch(e) {
                    localStorage.removeItem('auto_login_cred');
                }
            } else {
                localStorage.removeItem('just_logged_out');
            }
        })();

        document.getElementById('password').addEventListener('keypress', e => {
            if (e.key === 'Enter') doLogin();
        });

        // 修改密码
        function openChangePwd() {
            document.getElementById('pwdUsername').value = document.getElementById('username').value;
            document.getElementById('pwdOld').value = '';
            document.getElementById('pwdNew').value = '';
            document.getElementById('pwdConfirm').value = '';
            document.getElementById('pwdError').style.display = 'none';
            document.getElementById('pwdSuccess').style.display = 'none';
            document.getElementById('pwdModal').style.display = 'flex';
        }

        function closeChangePwd() {
            document.getElementById('pwdModal').style.display = 'none';
        }

        function submitChangePwd() {
            const username = document.getElementById('pwdUsername').value.trim();
            const old_password = document.getElementById('pwdOld').value;
            const new_password = document.getElementById('pwdNew').value;
            const confirm_password = document.getElementById('pwdConfirm').value;
            const errEl = document.getElementById('pwdError');
            const sucEl = document.getElementById('pwdSuccess');
            errEl.style.display = 'none';
            sucEl.style.display = 'none';

            if (!username || !old_password || !new_password || !confirm_password) {
                errEl.textContent = '请填写所有字段';
                errEl.style.display = 'block';
                return;
            }
            if (new_password.length < 4) {
                errEl.textContent = '新密码至少4位';
                errEl.style.display = 'block';
                return;
            }
            if (new_password !== confirm_password) {
                errEl.textContent = '两次输入的新密码不一致';
                errEl.style.display = 'block';
                return;
            }

            fetch('/api/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, old_password, new_password })
            })
            .then(res => res.json().then(data => ({ ok: res.ok, data })))
            .then(({ ok, data }) => {
                if (ok) {
                    sucEl.textContent = data.message || '密码修改成功';
                    sucEl.style.display = 'block';
                    setTimeout(() => {
                        closeChangePwd();
                        document.getElementById('password').value = new_password;
                    }, 1500);
                } else {
                    errEl.textContent = data.detail || '修改失败';
                    errEl.style.display = 'block';
                }
            })
            .catch(() => {
                errEl.textContent = '网络错误，请重试';
                errEl.style.display = 'block';
            });
        }

        // 忘记密码
        function openForgotPwd() {
            document.getElementById('forgotEmail').value = '';
            document.getElementById('forgotCode').value = '';
            document.getElementById('forgotNewPwd').value = '';
            document.getElementById('forgotConfirmPwd').value = '';
            document.getElementById('forgotError').style.display = 'none';
            document.getElementById('forgotSuccess').style.display = 'none';
            document.getElementById('sendCodeBtn').disabled = false;
            document.getElementById('sendCodeBtn').textContent = '发送验证码';
            document.getElementById('forgotModal').style.display = 'flex';
        }

        function closeForgotPwd() {
            document.getElementById('forgotModal').style.display = 'none';
        }

        let codeCountdown = 0;
        function sendResetCode() {
            const email = document.getElementById('forgotEmail').value.trim();
            const errEl = document.getElementById('forgotError');
            errEl.style.display = 'none';
            if (!email) {
                errEl.textContent = '请输入邮箱';
                errEl.style.display = 'block';
                return;
            }
            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;
            btn.textContent = '发送中...';
            fetch('/api/send-reset-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            })
            .then(res => res.json().then(data => ({ ok: res.ok, data })))
            .then(({ ok, data }) => {
                if (ok) {
                    btn.textContent = '已发送(60s)';
                    codeCountdown = 60;
                    const timer = setInterval(() => {
                        codeCountdown--;
                        if (codeCountdown <= 0) {
                            clearInterval(timer);
                            btn.disabled = false;
                            btn.textContent = '重新发送';
                        } else {
                            btn.textContent = `已发送(${codeCountdown}s)`;
                        }
                    }, 1000);
                } else {
                    btn.disabled = false;
                    btn.textContent = '发送验证码';
                    errEl.textContent = data.detail || '发送失败';
                    errEl.style.display = 'block';
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.textContent = '发送验证码';
                errEl.textContent = '网络错误，请重试';
                errEl.style.display = 'block';
            });
        }

        function submitResetPwd() {
            const email = document.getElementById('forgotEmail').value.trim();
            const code = document.getElementById('forgotCode').value.trim();
            const new_password = document.getElementById('forgotNewPwd').value;
            const confirm_password = document.getElementById('forgotConfirmPwd').value;
            const errEl = document.getElementById('forgotError');
            const sucEl = document.getElementById('forgotSuccess');
            errEl.style.display = 'none';
            sucEl.style.display = 'none';

            if (!email || !code || !new_password || !confirm_password) {
                errEl.textContent = '请填写所有字段';
                errEl.style.display = 'block';
                return;
            }
            if (new_password.length < 4) {
                errEl.textContent = '新密码至少4位';
                errEl.style.display = 'block';
                return;
            }
            if (new_password !== confirm_password) {
                errEl.textContent = '两次输入的新密码不一致';
                errEl.style.display = 'block';
                return;
            }

            fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code, new_password })
            })
            .then(res => res.json().then(data => ({ ok: res.ok, data })))
            .then(({ ok, data }) => {
                if (ok) {
                    sucEl.textContent = data.message || '密码重置成功';
                    sucEl.style.display = 'block';
                    setTimeout(() => {
                        closeForgotPwd();
                        document.getElementById('password').value = new_password;
                    }, 1500);
                } else {
                    errEl.textContent = data.detail || '重置失败';
                    errEl.style.display = 'block';
                }
            })
            .catch(() => {
                errEl.textContent = '网络错误，请重试';
                errEl.style.display = 'block';
            });
        }

    </script>
</body>
</html>
